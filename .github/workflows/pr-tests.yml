name: PR Tests - Automated Testing

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f "bun.lockb" ]; then
            bun install
          else
            npm ci
          fi

      - name: Run linting
        run: |
          if [ -f "bun.lockb" ]; then
            bun run lint
          else
            npm run lint
          fi

      - name: Type check
        run: |
          if [ -f "bun.lockb" ]; then
            bun run type-check || npx tsc --noEmit
          else
            npm run type-check || npx tsc --noEmit
          fi

      - name: Run tests
        run: |
          if [ -f "bun.lockb" ]; then
            bun run test
          else
            npm run test
          fi

      - name: Run tests with coverage
        run: |
          if [ -f "bun.lockb" ]; then
            bun run test:coverage
          else
            npm run test:coverage
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.event.pull_request.number }}
          path: coverage/
          retention-days: 7

      - name: Build application (test build)
        run: |
          if [ -f "bun.lockb" ]; then
            bun run build
          else
            npm run build
          fi
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🧪 Test Results')
            );

            const testStatus = '${{ job.status }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
            const body = `## 🧪 Test Results

            **Status:** ${testStatus}
            **Commit:** ${{ github.event.pull_request.head.sha }}
            **Branch:** ${{ github.event.pull_request.head.ref }}

            ### Test Summary:
            - ✅ Linting
            - ✅ Type checking  
            - ✅ Unit tests
            - ✅ Test coverage
            - ✅ Build verification

            ${testStatus === '❌ FAILED' ? '⚠️ Please check the workflow logs for details.' : '🎉 All tests passed! Ready for review.'}

            ---
            *Automated comment by GitHub Actions*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
