# Nginx configuration for chhuonmakararoth.site
# This fixes the HTTP to HTTPS redirect issue reported in the SEO audit

# HTTP server block - redirects all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chhuonmakararoth.site www.chhuonmakararoth.site;

    # Redirect all HTTP requests to HTTPS (301 Permanent Redirect)
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chhuonmakararoth.site www.chhuonmakararoth.site;

    # SSL certificate configuration (Let's Encrypt example)
    ssl_certificate /etc/letsencrypt/live/chhuonmakararoth.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chhuonmakararoth.site/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect www to non-www (choose one canonical version)
    # Uncomment the following block if you want to redirect www to non-www:
    # if ($host = 'www.chhuonmakararoth.site') {
    #     return 301 https://chhuonmakararoth.site$request_uri;
    # }

    # Proxy to Next.js application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
